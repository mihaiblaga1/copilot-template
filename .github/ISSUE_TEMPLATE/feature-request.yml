name: Feature request
description: Propose a new feature or an improvement to an existing one.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, search existing issues to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: |
        Describe the user need or business problem. Explain *why* this matters, not what to build.
        Frame it as: "As a [user type], I want to [goal] so that [reason]."
      placeholder: "As an ops team member, I want to set a per-alert cooldown period so that I'm not paged more than once per hour for the same issue."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: |
        Describe the feature you have in mind. Include rough UI flows, API shapes, or mockups if you have them.
        This is a starting point for discussion — it doesn't have to be the final design.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider? Why did you rule them out?

  - type: dropdown
    id: impact
    attributes:
      label: Who is affected?
      description: How broadly does this impact users?
      options:
        - All users
        - Users on a specific plan (specify in additional context)
        - Admins / internal team only
        - A specific integration or workflow (specify below)
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How urgent is this?
      options:
        - Blocking — cannot proceed without it
        - High — significantly improves a core workflow
        - Medium — quality-of-life improvement
        - Low — nice to have
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, competitor examples, customer quotes, analytics data — anything that helps prioritise this.
